name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Gate the release on the test suite and a clean lint. Without this every
      # push to main ships, passing or not.
      - name: Test
        run: cargo test --release

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Windows
        run: cargo build --target x86_64-pc-windows-gnu --release

      - name: Build Linux
        run: cargo build --release

      # Package the Linux build as an AppImage: one double-clickable file that
      # carries the icon + .desktop and registers a menu entry on first run, so
      # there's no loose icon to ship. Replaces the bare ELF binary.
      - name: Package Linux AppImage
        run: |
          # AppDir layout: binary under usr/bin; icon + .desktop at the root (the
          # icon's name must match the .desktop's Icon= key); AppRun is the entry point.
          APPDIR=build/AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp target/release/voxely "$APPDIR/usr/bin/voxely"
          chmod +x "$APPDIR/usr/bin/voxely"
          cp icon.png "$APPDIR/voxely.png"
          cat > "$APPDIR/voxely.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Voxely
          # %f passes the path of the file chosen via "Open With…" / a double-click
          # as the first argument; without it the app launches but never opens it.
          Exec=voxely %f
          Icon=voxely
          Categories=Graphics;3DGraphics;
          # Advertise the formats Voxely opens so it shows up in file managers'
          # "Open With" list for .obj.
          MimeType=model/obj;
          Terminal=false
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/voxely" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          # appimagetool is itself an AppImage; APPIMAGE_EXTRACT_AND_RUN lets it run
          # on the runner without FUSE.
          curl -L --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 \
            -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" "$APPDIR" build/voxely-x86_64.AppImage

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/voxely.exe dist/voxely-windows-x86_64.exe
          cp build/voxely-x86_64.AppImage dist/voxely-x86_64.AppImage

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ github.run_number }}
          files: dist/*
