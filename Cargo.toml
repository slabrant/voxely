[package]
name = "voxely"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.29"
wgpu = "0.19"
env_logger = "0.11"
log = "0.4"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.27"
serde = { version = "1.0", features = ["derive"] }
dot_vox = "5.2"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
rfd = "0.14"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
